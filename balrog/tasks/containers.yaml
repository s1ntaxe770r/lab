---
# #### ======JELLY #######
- name: Create jellyfin config directory
  file:
    path: "~/configs/jellyfin/config"
    state: directory
    mode: "0755"

- name: Create jellyfin cache directory
  file:
    path: "~/configs/jellyfin/cache"
    state: directory
    mode: "0755"

- name: Create media directory
  file:
    path: "~/media/movives"
    state: directory
    mode: "0755"

- name: Create jellyfin container
  become: true
  community.docker.docker_container:
    name: jellyfin
    image: "jellyfin/jellyfin:latest"
    # user: "1000:1000"
    ports:
      - 8096:8096/tcp
      - 7359:7359/udp
    volumes:
      - "~/configs/jellyfin/config:/config"
      - "~/configs/jellyfin/cache:/cache"
      - "~/media:/media"
    restart_policy: unless-stopped
    privileged: true
    state: started
  tags: jellyfin

### ======JELLY #######

#### ======QBIT #######
- name: Create qbittorrent-nox config directory
  file:
    path: "~/configs/qbittorrent-nox/config"
    state: directory
    mode: "0755"
  tags: qbittorrent

- name: Create qbittorrent-nox downloads directory
  file:
    path: "~/torrents"
    state: directory
    mode: "0755"
  tags: qbittorrent

- name: Create qbittorrent-nox container
  become: true
  community.docker.docker_container:
    name: qbittorrent-nox
    image: "qbittorrentofficial/qbittorrent-nox:latest"
    env:
      QBT_EULA: "accept"
      QBT_VERSION: "latest"
      QBT_WEBUI_PORT: "8080"
      TZ: "{{ ansible_facts.get('timezone', 'UTC') }}"
    ports:
      - 6881:6881/tcp
      - 6881:6881/udp
      - 8080:8080/tcp
    volumes:
      - "~/configs/qbittorrent-nox/config:/config"
      - "~/torrents:/downloads"
    read_only: true
    tmpfs:
      - /tmp
    tty: true
    restart_policy: unless-stopped
    stop_timeout: 1800
    state: started
  tags: qbittorrent
#### ======QBIT #######

#### ======RADARR #######
- name: Create radarr config directory
  file:
    path: "~/configs/radarr/config"
    state: directory
    mode: "0755"
  tags: radarr

- name: Create radarr container
  become: true
  community.docker.docker_container:
    name: radarr
    image: "lscr.io/linuxserver/radarr:latest"
    env:
      PUID: "1000"
      PGID: "1000"
      TZ: "{{ ansible_facts.get('timezone', 'UTC') }}"
    ports:
      - "7878:7878"
    volumes:
      - "~/configs/radarr/config:/config"
      - "~/media/movives:/movies"
      - "~/torrents:/downloads"
    restart_policy: unless-stopped
    state: started
  tags: radarr
#### ======RADARR #######

#### ======FLARESOLVERR #######
- name: Create flaresolverr container
  become: true
  community.docker.docker_container:
    name: flaresolverr
    image: "ghcr.io/flaresolverr/flaresolverr:latest"
    env:
      LOG_LEVEL: "info"
      TZ: "{{ ansible_facts.get('timezone', 'UTC') }}"
    ports:
      - "8191:8191"
    restart_policy: unless-stopped
    state: started
  tags: flaresolverr
#### ======FLARESOLVERR #######

