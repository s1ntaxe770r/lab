#### ======PLEX #######
- name: Create plex config directory
  file:
    path: "~/configs/plex/config"
    state: directory
    mode: "0755"
  tags: plex

- name: Create plex container
  become: true
  community.docker.docker_container:
    name: plex
    image: "lscr.io/linuxserver/plex:latest"
    env:
      TZ: "{{ ansible_facts.get('timezone', 'UTC') }}"
      VERSION: "docker"
      PLEX_CLAIM: "{{ vault_plex_token }}"
    ports:
      - "32400:32400"
    volumes:
      - "~/configs/plex/config:/config"
      - "~/media/series:/tv"
      - "~/media/movives:/movies"
      - "~/media/music:/music"
    restart_policy: unless-stopped
    state: started
  tags: plex
#### ======PLEX #######

#### ======GLANCES #######
- name: Create glances config directory
  file:
    path: "~/configs/glances/config"
    state: directory
    mode: "0755"
  tags: glances

- name: Copy glances config file
  copy:
    src: "glances.yml"
    dest: "~/configs/glances/config/glance.yml"
    mode: "0644"
  tags: glances

- name: Create glances container
  community.docker.docker_container:
    name: glances
    image: "glanceapp/glance:latest"
    ports:
      - "8888:8080"
    volumes:
      - "~/configs/glances/config:/app/config"
    restart_policy: unless-stopped
    state: started
  tags: glances
#### ======GLANCES #######

#### ======PROWLARR ======
- name: Create prowlarr config directory
  file:
    path: "~/configs/prowlarr/config"
    state: directory
    mode: "0755"
  tags: prowlarr

- name: Create prowlarr container
  become: true
  community.docker.docker_container:
    name: prowlarr
    image: lscr.io/linuxserver/prowlarr:latest
    env:
      PUID: "1000"
      PGID: "1000"
      TZ: "{{ ansible_facts.get('timezone', 'UTC') }}"
    ports:
