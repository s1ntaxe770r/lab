#### ======RECYCLARR #######
- name: Create recyclarr config directory
  file:
    path: "~/configs/recyclarr"
    state: directory
    mode: "0755"
  tags: recyclarr

- name: Copy recyclarr config
  template:
    src: "recyclarr.yml.j2"
    dest: "~/configs/recyclarr/recyclarr.yml"
    mode: "0644"
  tags: recyclarr

- name: Create recyclarr container
  become: true
  community.docker.docker_container:
    name: recyclarr
    image: "ghcr.io/recyclarr/recyclarr:latest"
    env:
      TZ: "{{ ansible_facts.get('timezone', 'UTC') }}"
      PUID: "1000"
      PGID: "1000"
    volumes:
      - "~/configs/recyclarr:/config"
    restart_policy: unless-stopped
    state: started
  tags: recyclarr
#### ======RECYCLARR #######

