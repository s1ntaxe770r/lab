## this would be for things like gotop, neofetch etc.
---



- name: Install lazydocker
  shell: |
    cd /tmp
    curl -L https://github.com/jesseduffield/lazydocker/releases/download/v0.24.3/lazydocker_0.24.3_Linux_x86_64.tar.gz -o lazydocker.tar.gz
    tar -xzf lazydocker.tar.gz
    mv lazydocker /usr/local/bin/
    chmod +x /usr/local/bin/lazydocker
    rm -f lazydocker.tar.gz
  args:
    executable: /bin/bash
    creates: /usr/local/bin/lazydocker
  become: true
  tags: utils

- name: Ensure /mnt/thomas directory exists for mounting drive
  file:
    path: "/mnt/thomas"
    state: directory
    mode: '0755'
  become: true


- name: Set ownership of /mnt/thomas to current user and group
  ansible.builtin.file:
    path: "/mnt/thomas"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    recurse: true
  become: true


- name: Set permissions on /mnt/thomas
  ansible.builtin.file:
    path: "/mnt/thomas"
    mode: '0744'
    recurse: true
  become: true


- name: Backup /etc/fstab before making changes
  ansible.builtin.copy:
    src: /etc/fstab
    dest: /etc/fstab.bkp
    owner: root
    group: root
    mode: '0644'
    remote_src: true
  become: true
  tags: backup

  
- name: Get UUID of /dev/sdb
  ansible.builtin.shell: blkid -s UUID -o value /dev/sdb
  register: sdb_uuid
  become: true
  changed_when: false
  tags: fstab

- name: Ensure UUID-based fstab entry for /mnt/thomas
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: "^(UUID={{ sdb_uuid.stdout }}|/dev/sdb)\\s+/mnt/thomas\\s"
    line: "UUID={{ sdb_uuid.stdout }} /mnt/thomas auto defaults,nofail 0 2"
    state: present
    insertafter: EOF
    backup: false
  become: true
  tags: fstab
  when: sdb_uuid.stdout != ""

- name: Mount all filesystems from fstab
  ansible.builtin.command: mount -a
  become: true
  tags: mount

#### ====== EXTEND LVM TO USE FULL INTERNAL SSD ======

- name: Extend logical volume to use all free space
  ansible.builtin.command: lvextend -l +100%FREE /dev/ubuntu-vg/ubuntu-lv
  become: true
  register: lv_extend
  changed_when: "'successfully resized' in lv_extend.stdout"
  failed_when: lv_extend.rc != 0 and 'matches existing size' not in lv_extend.stderr
  tags: extend-lv

- name: Resize filesystem to fill extended volume
  ansible.builtin.command: resize2fs /dev/ubuntu-vg/ubuntu-lv
  become: true
  tags: extend-lv

