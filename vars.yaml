mount_path: /mnt/thomas
mount_uuid: 66ce4e71-7215-4897-b7cc-9ca4fe24d28e

# Oh My Zsh Configuration
ohmyzsh_users:
  - e770r
  - root

# Cloudflare R2 Backup Configuration
# Sensitive values are stored in vault.yaml (encrypted with ansible-vault)
r2_account_id: "{{ vault_r2_account_id }}"
r2_access_key_id: "{{ vault_r2_access_key_id }}"
r2_secret_access_key: "{{ vault_r2_secret_access_key }}"
r2_bucket_name: "backups"
r2_endpoint: "https://{{ vault_r2_account_id }}.r2.cloudflarestorage.com"

# Backup Configuration
backup_source_dir: "~/configs"
backup_script_path: "/usr/local/bin/backup-configs.sh"
backup_time_hour: "0"
backup_time_minute: "0"
backup_weekday: "6"  # 0=Sunday, 6=Saturday

# Telegram qBittorrent Notifier
# Sensitive values are stored in vault.yaml
qbit_username: "{{ vault_qbit_username }}"
qbit_password: "{{ vault_qbit_password }}"
telegram_bot_token: "{{ vault_telegram_bot_token }}"
telegram_chat_id: "{{ vault_telegram_chat_id }}"
telegram_notif_poll_interval: 30

# TLS (Caddy + Tailscale-issued certs + local DNS resolver)
# Certs are fetched via `tailscale cert` for this single hostname and reused
# by Caddy on both the Tailscale interface and the LAN interface, so the same
# URL works whether you're on the tailnet or just on the same WiFi.
tailnet_hostname: "chronos.tail7e3de.ts.net"
tls_services:
  - { name: glance, port: 8888, tls_port: 443 }
  - { name: jellyfin, port: 8096, tls_port: 9096 }
  - { name: grafana, port: 3000, tls_port: 4000 }
  - { name: prowlarr, port: 9696, tls_port: 10696 }
  - { name: qbittorrent, port: 8080, tls_port: 9080 }

# LAN TLS via a public DNS record pointing at a private IP (no device/router
# changes needed - any DNS resolver a client already uses will resolve these
# names straight to chronos's LAN IP, and the connection stays on the LAN).
# Cert is a real wildcard cert issued via Cloudflare DNS-01 (acme.sh).
cloudflare_zone: "gopherlabs.xyz"
homelab_subdomain: "home"
homelab_domain: "{{ homelab_subdomain }}.{{ cloudflare_zone }}"
cloudflare_account_id: "{{ vault_cloudflare_account_id }}"
cloudflare_api_token: "{{ vault_cloudflare_api_token }}"

# Recyclarr (syncs TRaSH-guides quality profiles into Radarr)
# Radarr only generates its API key on first boot, so this stays blank until
# you copy it from Radarr's UI (Settings > General > API Key) into vault.yaml
# as vault_radarr_api_key, then re-run with --tags recyclarr.
radarr_api_key: "{{ vault_radarr_api_key | default('') }}"
